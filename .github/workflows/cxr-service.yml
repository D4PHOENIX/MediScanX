# =============================================================================
# MediScanX — cxr_service CI/CD Pipeline
# =============================================================================
# Trigger : Pull Requests to `dev` or `main` branch touching any file under backend/cxr_service/**
# Runner  : ubuntu-latest
# Toolchain: uv (astral-sh) with optimal PyTorch CPU wheel caching
# Jobs    : 1. test        — mocked pytest suite (required gate to merge)
#           2. docker-build — multi-stage Dockerfile dry-run (no push)
#
# best_thresholds.npy mocking strategy
# --------------------------------------
# The threshold file is loaded in CXREngine._load(), guarded by a
# try/except FileNotFoundError that falls back to 0.5 for all classes.
# In CI we set CXR_THRESHOLDS_PATH to a /dev/null/... path so that
# Path(thresholds_path) does not exist → clean fallback, no disk I/O,
# no mocked numpy file needed.  The same /dev/null strategy applies to
# CXR_WEIGHTS_PATH (handled by the existing SkinEngine.initialize stub).
#
# PyTorch caching strategy
# ------------------------
# torchvision + torch CPU wheels are large (~500 MB combined).  We cache
# via astral-sh/setup-uv keyed on uv.lock.  Unchanged lockfile = warm
# restore in seconds.  The [tool.uv.sources] pytorch-cpu index in
# pyproject.toml pins CPU-only builds.
# =============================================================================

name: cxr-service CI

on:
    pull_request:
        branches:
            - dev
            - main
        paths:
            - "backend/cxr_service/**"

# Cancel any superseded run for the same PR branch immediately.
concurrency:
    group: cxr-service-${{ github.head_ref }}
    cancel-in-progress: true

env:
    UV_VERSION: "0.5.18"
    PYTHON_VERSION: "3.11"
    IMAGE_NAME: mediscanx/cxr-service

# =============================================================================
# JOB 1 — Test
# =============================================================================
jobs:
    test:
        name: "Pytest Suite (mocked weights + thresholds)"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend/cxr_service

        env:
            # -----------------------------------------------------------------------
            # CXR_WEIGHTS_PATH / CXR_THRESHOLDS_PATH are read by pydantic-settings
            # (Settings) at import time.
            #
            # /dev/null/... paths guarantee:
            #   - Path.exists() → False  (no FileNotFoundError from missing mounts)
            #   - CXREngine._load() falls back gracefully:
            #       weights   → CXRModelNotFoundError caught by the lifespan stub
            #       thresholds → FileNotFoundError → fallback to 0.5 per-class array
            #   - No physical .pth or .npy files need to be present in the runner
            # -----------------------------------------------------------------------
            CXR_WEIGHTS_PATH: "/dev/null/mock_densenet.pth"
            CXR_THRESHOLDS_PATH: "/dev/null/mock_thresholds.npy"
            CXR_KAGGLE_ROOT: ""
            CXR_CSV_TEST_PATH: ""

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            # Dual-layer PyTorch caching:
            #   1. Wheel download cache (~/.cache/uv) keyed on uv.lock hash
            #   2. Virtualenv restore when lock is unchanged
            # pytorch-cpu index pins CPU-only torch + torchvision (~500 MB total).
            - name: Install uv ${{ env.UV_VERSION }}
              uses: astral-sh/setup-uv@v5
              with:
                  version: ${{ env.UV_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: "backend/cxr_service/uv.lock"

            # -----------------------------------------------------------------------
            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            # -----------------------------------------------------------------------
            - name: Network Diagnostics
              run: |
                  echo "Testing PyPI connectivity..."
                  curl -I -v -m 10 https://pypi.org || echo "PyPI unreachable"
                  echo "Testing GitHub connectivity..."
                  curl -I -v -m 10 https://github.com || echo "GitHub unreachable"

            # -----------------------------------------------------------------------
            # --frozen prevents lock-file mutation (reproducible CI builds).
            # Dev extras supply pytest + pytest-asyncio + httpx.
            # Hardened against transient drops with UV_HTTP_TIMEOUT and shell retries.
            - name: Install dependencies (uv sync --frozen)
              env:
                  UV_HTTP_TIMEOUT: "120"
              run: |
                  for i in {1..5}; do
                      echo "Attempt $i to sync dependencies..."
                      if uv sync --frozen --all-packages --all-extras; then
                          echo "Dependencies synced successfully."
                          break
                      else
                          echo "uv sync failed. Retrying in 10s..."
                          sleep 10
                      fi
                  done

            # -----------------------------------------------------------------------
            - name: Run pytest
              run: |
                  uv run pytest tests/ \
                    --tb=short \
                    --strict-markers \
                    -v \
                    --color=yes \
                    --junitxml=pytest-results.xml

            # -----------------------------------------------------------------------
            - name: Upload pytest results
              if: always() && !env.ACT
              uses: actions/upload-artifact@v4
              with:
                  name: cxr-pytest-results-${{ github.run_number }}
                  path: backend/cxr_service/pytest-results.xml
                  retention-days: 7

    # =============================================================================
    # JOB 2 — Docker dry-run build
    # =============================================================================
    docker-build:
        name: "Docker Build (dry-run, no push)"
        runs-on: ubuntu-latest
        needs: test

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # -----------------------------------------------------------------------
            # Full multi-stage build without pushing.
            # --load exports to the local daemon so the smoke test below can run.
            # --no-cache exercises every layer on every PR (catches stale COPY paths).
            - name: Build cxr_service Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend/cxr_service
                  file: ./backend/cxr_service/Dockerfile
                  push: false
                  load: true
                  no-cache: true
                  tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.repository }}

            # -----------------------------------------------------------------------
            # Smoke-test: verify the full Python import chain resolves inside the
            # runtime image without starting the ASGI server.  This catches:
            #   - Dockerfile COPY path regressions (Bug #10 pattern)
            #   - Missing dependencies not caught at build time
            #   - num_classes calculation (14 + 6 = 20)
            #   - Absence of print() calls in __post_init__ (Bug #2 regression)
            - name: Smoke-test image import chain
              run: |
                  docker run --rm \
                    -e CXR_WEIGHTS_PATH=/dev/null/mock_densenet.pth \
                    -e CXR_THRESHOLDS_PATH=/dev/null/mock_thresholds.npy \
                    -e CXR_KAGGLE_ROOT="" \
                    -e CXR_CSV_TEST_PATH="" \
                    ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
                    python -c "import sys, io, contextlib; sys.path.insert(0, '/app/src'); from app.core.config import Settings as CXRInferenceConfig; from app.core.exceptions import ExceptionRegistry; captured = io.StringIO(); ctx = contextlib.redirect_stdout(captured); ctx.__enter__(); cfg = CXRInferenceConfig(); ctx.__exit__(None, None, None); assert captured.getvalue() == '', f'__post_init__ still calls print(): {captured.getvalue()!r}'; assert cfg.num_classes == 20, f'Wrong num_classes: {cfg.num_classes}'; assert len(cfg.chexpert_labels) == 14; assert cfg.classification_thresholds is None; assert cfg.image_size == (320, 320); print('Import OK — Settings, ExceptionRegistry load cleanly.'); print(f'num_classes={cfg.num_classes}  image_size={cfg.image_size}'); print('No print() calls detected in __post_init__ (Bug #2 regression check passed.')"
