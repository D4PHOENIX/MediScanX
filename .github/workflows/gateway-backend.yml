# =============================================================================
# MediScanX — gateway_backend CI/CD Pipeline
# =============================================================================
# Trigger : Pull Requests to `dev` or `main` branch touching any file under gateway_**
# Runner  : ubuntu-latest
# Toolchain: uv (astral-sh)
# Jobs    : 1. test         — pytest suite with all mandatory env vars injected
#           2. docker-build  — multi-stage Dockerfile dry-run (no push)
#
# python-multipart dependency
# ---------------------------
# python-multipart is listed as a production dependency in pyproject.toml.
# `uv sync --frozen` installs it automatically from the locked uv.lock, so
# no extra pip install step is needed.
#
# JWT / mandatory env vars strategy
# ----------------------------------
# GatewayConfig has four required fields with no defaults.  They are
# injected as GitHub Actions `env:` vars so pydantic-settings can resolve
# Secrets and must be configured in the repository settings.
# =============================================================================

name: gateway-backend CI

on:
    pull_request:
        branches:
            - dev
            - main
        paths:
            - "backend/gateway_backend/**"

# Cancel superseded runs for the same PR branch immediately.
concurrency:
    group: gateway-backend-${{ github.head_ref }}
    cancel-in-progress: true

env:
    UV_VERSION: "0.5.18"
    PYTHON_VERSION: "3.11"
    IMAGE_NAME: mediscanx/gateway-backend

# =============================================================================
# JOB 1 — Test
# =============================================================================
jobs:
    test:
        name: "Pytest Suite (mocked Supabase + downstream services)"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend/gateway_backend

        env:
            # -----------------------------------------------------------------------
            # GatewayConfig mandatory fields — all four must be present or the
            # pydantic-settings ValidationError aborts test collection.
            #
            # Store the real secret in GitHub Secrets; the mock value here is only
            # used to validate the JWT rejection / acceptance logic with fake tokens.
            # -----------------------------------------------------------------------
            SUPABASE_URL: "http://mock-supabase"
            SUPABASE_PUBLISHABLE_KEY: "mock-anon-key"
            SUPABASE_SECRET_KEY: "mock-service-role-key"

            # Internal microservice URLs (unreachable in CI — all proxied calls are
            # mocked via httpx patch in the test suite)
            CXR_SERVICE_URL: "http://cxr-mock"
            ECG_SERVICE_URL: "http://ecg-mock"
            SKIN_SERVICE_URL: "http://skin-mock"
            AGENT_SERVICE_URL: "http://agent-mock"

            # Dev-token bypass active so tests do not need real HS256 JWTs
            DEV_MODE: "true"

            # CORS: allow a test domain in CI so CORS reflection tests pass
            ALLOWED_ORIGINS: "https://test-origin.example.com"

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            # Cache pip/wheel downloads keyed on uv.lock.  The gateway has no heavy
            # ML wheels (no torch/torchvision) so the cache is small (~30 MB).
            - name: Install uv ${{ env.UV_VERSION }}
              uses: astral-sh/setup-uv@v5
              with:
                  version: ${{ env.UV_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: "gateway_uv.lock"

            # -----------------------------------------------------------------------
            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            # -----------------------------------------------------------------------
            - name: Network Diagnostics
              run: |
                  echo "Testing PyPI connectivity..."
                  curl -I -v -m 10 https://pypi.org || echo "PyPI unreachable"
                  echo "Testing GitHub connectivity..."
                  curl -I -v -m 10 https://github.com || echo "GitHub unreachable"

            # -----------------------------------------------------------------------
            # --frozen: reproducible install from the locked uv.lock.
            # Dev extras supply pytest + pytest-asyncio.
            # python-multipart is a production dependency (listed in pyproject.toml)
            # so it is included automatically — no separate install step needed.
            # Hardened against transient drops with UV_HTTP_TIMEOUT and shell retries.
            - name: Install dependencies (uv sync --frozen)
              env:
                  UV_HTTP_TIMEOUT: "120"
              run: |
                  for i in {1..5}; do
                      echo "Attempt $i to sync dependencies..."
                      if uv sync --frozen --all-packages --all-extras; then
                          echo "Dependencies synced successfully."
                          break
                      else
                          echo "uv sync failed. Retrying in 10s..."
                          sleep 10
                      fi
                  done

            # -----------------------------------------------------------------------
            - name: Run pytest
              env:
                  SUPABASE_URL: "http://mock-supabase"
                  SUPABASE_PUBLISHABLE_KEY: "mock-anon-key"
                  SUPABASE_SECRET_KEY: "mock-service-role-key"
                  ALLOWED_ORIGINS: "https://test-origin.example.com"
                  CXR_SERVICE_URL: "http://cxr-mock"
                  ECG_SERVICE_URL: "http://ecg-mock"
                  SKIN_SERVICE_URL: "http://skin-mock"
                  AGENT_SERVICE_URL: "http://agent-mock"
                  DEV_MODE: "true"
              run: |
                  uv run pytest tests/ \
                    --tb=short \
                    --strict-markers \
                    -v \
                    --color=yes \
                    --junitxml=pytest-results.xml

            # -----------------------------------------------------------------------
            - name: Upload pytest results
              if: always() && !env.ACT
              uses: actions/upload-artifact@v4
              with:
                  name: gateway-pytest-results-${{ github.run_number }}
                  path: backend/gateway_backend/pytest-results.xml
                  retention-days: 7

    # =============================================================================
    # JOB 2 — Docker dry-run build
    # =============================================================================
    docker-build:
        name: "Docker Build (dry-run, no push)"
        runs-on: ubuntu-latest
        needs: test

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # -----------------------------------------------------------------------
            # Full multi-stage build without pushing.
            # --no-cache exercises every layer on every PR (catches stale COPY paths,
            # dependency resolution failures, and non-root user setup).
            - name: Build gateway_backend Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend/gateway_backend
                  push: false
                  load: true
                  no-cache: true
                  tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.repository }}

            # -----------------------------------------------------------------------
            # Smoke-test: verify the full Python import chain resolves inside the
            # runtime image without starting the ASGI server.  This catches:
            #   - Dockerfile COPY path regressions (Bug #9 pattern)
            #   - Missing dependencies not caught at build time
            #   - CORS config field resolution (Bug #1 regression)
            #   - Absence of PyJWT import errors (it was removed — Bug #11)
            - name: Smoke-test image import chain
              run: |
                  docker run --rm \
                    -e SUPABASE_URL=http://mock-supabase \
                    -e SUPABASE_PUBLISHABLE_KEY=mock-anon-key \
                    -e SUPABASE_SECRET_KEY=mock-service-role-key \
                    -e CXR_SERVICE_URL=http://cxr-mock \
                    -e ECG_SERVICE_URL=http://ecg-mock \
                    -e SKIN_SERVICE_URL=http://skin-mock \
                    -e AGENT_SERVICE_URL=http://agent-mock \
                    -e DEV_MODE=true \
                    -e ALLOWED_ORIGINS=https://test-origin.example.com \
                    -e DEV_TOKEN_SECRET=test-dev-token-secret \
                    -e SUPABASE_STORAGE_BUCKET=scan-images \
                    -e MAX_UPLOAD_BYTES=20971520 \
                    ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
                    python -c "import sys; sys.path.insert(0, '/app/src'); from app.core.config import gateway_config, GatewayConfig; from app.core.security import get_current_user; from app.core.exceptions import ExceptionRegistry; assert '*' not in gateway_config.allowed_origins, 'CORS wildcard still present in allowed_origins — Bug #1 regression!'; from app.main import create_app; app_instance = create_app(); assert app_instance is not None; from jose import jwt; assert hasattr(jwt, 'decode'), 'python-jose jwt.decode missing'; assert gateway_config.max_upload_bytes == 20 * 1024 * 1024, f'Unexpected max_upload_bytes: {gateway_config.max_upload_bytes}'; print('Import OK — gateway_config, security, exceptions load cleanly.'); print(f'allowed_origins={gateway_config.allowed_origins}'); print(f'max_upload_bytes={gateway_config.max_upload_bytes // (1024*1024)} MiB'); print('No CORS wildcard detected (Bug #1 regression check passed.'); print('COPY path fix verified — app.main imports successfully (Bug #9 passed.')"
