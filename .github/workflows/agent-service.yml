# =============================================================================
# MediScanX — agent_service CI/CD Pipeline
# =============================================================================
# Trigger : Pull Requests targeting the `dev` or `main` branch that touch any file
#            under agent_service/**.
# Runner  : ubuntu-latest
# Toolchain: uv (astral-sh) for fast, lock-file-reproducible installs
# Jobs    : 1. test        — run mocked pytest suite (required gate to merge)
#           2. docker-build — dry-run multi-stage Dockerfile (no push)
#
# Heavy Initialization Mocking Strategy
# --------------------------------------
# The LangGraph `AsyncPostgresSaver` and `HuggingFaceEmbeddings` (MedCPT) are
# highly IO-bound and require a live database / large model downloads.
# In CI, we run a completely mocked `pytest` suite. The test runner uses
# `conftest.py` to deeply patch `app.agent.graph.build_graph` and its dependencies.
# This ensures that no database pools are opened, no 768-dim embedding models are
# downloaded, and no Google Gemini API calls are made.
#
# Environment Variable Injection
# --------------------------------------
# We supply dummy values for all mandatory Gateway / DB credentials directly
# in the `env:` block. This fulfills pydantic-settings validation requirements
# without exposing any real secrets to the GitHub Actions runner.
# =============================================================================

name: agent-service CI

on:
    pull_request:
        branches:
            - dev
            - main
        paths:
            - "backend/agent_service/**"

# Cancel any in-flight run for the same PR branch to save CI minutes.
concurrency:
    group: agent-service-${{ github.head_ref }}
    cancel-in-progress: true

env:
    # Pinned uv version — bump intentionally so upgrades are reviewed.
    UV_VERSION: "0.5.18"
    # Python version must match requires-python in pyproject.toml
    PYTHON_VERSION: "3.10"
    # Docker image name (no registry push in PR pipelines)
    IMAGE_NAME: mediscanx/agent-service

# =============================================================================
# JOB 1 — Test
# =============================================================================
jobs:
    test:
        name: "Pytest Suite (mocked)"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend/agent_service

        env:
            # Safe dummy values — real credentials are never needed for the mocked
            # test suite, but the application import chain reads them at module load.
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-gemini-key' }}
            # DATABASE_URL uses a mock .pooler.supabase.com host to pass AgentConfig strict initialization validation
            DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci_user:ci_pass@aws-0-eu-central-1.pooler.supabase.com:5432/ci_db' }}
            SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'http://mock-supabase' }}
            SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'mock-service-role-key' }}
            CXR_SERVICE_URL: "http://mock-cxr:8001/predict"
            ECG_SERVICE_URL: "http://mock-ecg:8002/predict"
            SKIN_SERVICE_URL: "http://mock-skin:8003/predict"
            GOOGLE_MODEL: "gemini-2.5-flash"

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            - name: Install uv ${{ env.UV_VERSION }}
              uses: astral-sh/setup-uv@v5
              with:
                  version: ${{ env.UV_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: "agent_service/uv.lock"

            # -----------------------------------------------------------------------
            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            # -----------------------------------------------------------------------
            - name: Network Diagnostics
              run: |
                  echo "Testing PyPI connectivity..."
                  curl -I -v -m 10 https://pypi.org || echo "PyPI unreachable"
                  echo "Testing GitHub connectivity..."
                  curl -I -v -m 10 https://github.com || echo "GitHub unreachable"

            # -----------------------------------------------------------------------
            # --frozen ensures the lock file is never mutated in CI.
            # Dev extras are included (no --no-dev) because pytest lives there.
            # Hardened against transient drops with UV_HTTP_TIMEOUT and shell retries.
            - name: Install dependencies (uv sync --frozen)
              env:
                  UV_HTTP_TIMEOUT: "120"
              run: |
                  for i in {1..5}; do
                      echo "Attempt $i to sync dependencies..."
                      if uv sync --frozen --all-packages --all-extras; then
                          echo "Dependencies synced successfully."
                          break
                      else
                          echo "uv sync failed. Retrying in 10s..."
                          sleep 10
                      fi
                  done

            # -----------------------------------------------------------------------
            - name: Run pytest
              run: |
                  uv run pytest tests/ \
                    --tb=short \
                    --strict-markers \
                    -v \
                    --color=yes \
                    --junitxml=pytest-results.xml

            # -----------------------------------------------------------------------
            - name: Upload test results
              if: always() && !env.ACT
              uses: actions/upload-artifact@v4
              with:
                  name: pytest-results-${{ github.run_number }}
                  path: backend/agent_service/pytest-results.xml
                  retention-days: 7

    # =============================================================================
    # JOB 2 — Docker dry-run build
    # =============================================================================
    docker-build:
        name: "Docker Build (dry-run, no push)"
        runs-on: ubuntu-latest
        needs: test

        steps:
            # -----------------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------------
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # -----------------------------------------------------------------------
            # Build both stages (builder + runtime) without pushing to any registry.
            # --load exports to local Docker daemon for the smoke test below.
            # --no-cache validates the full build path on every PR run.
            - name: Build agent_service Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend/agent_service
                  file: ./backend/agent_service/Dockerfile
                  push: false
                  load: true
                  no-cache: true
                  tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.repository }}

            # -----------------------------------------------------------------------
            # Verify the Python import chain resolves cleanly inside the image.
            - name: Smoke-test image entrypoint
              run: |
                  docker run --rm \
                    -e GEMINI_API_KEY=ci-dummy \
                    -e DATABASE_URL=postgresql://ci:ci@aws-0-eu-central-1.pooler.supabase.com:5432/ci \
                    -e SUPABASE_URL=http://localhost \
                    -e SUPABASE_SECRET_KEY=ci-dummy \
                    ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
                    python -c "import sys; sys.path.insert(0, '/app/src'); from app.core.config import AgentConfig; import app.main; print('Import OK')"
